name: FPL Draft 8905 Sync + Pages

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, offset from the top of the hour to avoid peak scheduler load.
    - cron: "17 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-draft-8905-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate fetcher
        run: |
          python -m py_compile scripts/fetch_fpl_draft.py
          python tests/test_logic.py

      - name: Fetch FPL Draft data
        run: |
          python scripts/fetch_fpl_draft.py \
            --league-id 8905 \
            --watch-player Wirtz

      - name: Commit changed data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No FPL Draft data changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: update FPL Draft league 8905"
          git push

  deploy-pages:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out latest data
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build public JSON site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp data/fpl-draft.json _site/data/fpl-draft.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
